<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{PAGE_TITLE}}</title>
<style>
  /* Edit these to match your dashboard */
  :root {
    --bg: #ffffff;
    --card: #ffffff;
    --text: #1d2433;
    --muted: #667085;
    --accent: #1f5eff;
    --border: #e4e7ec;
    --radius: 10px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font);
    display: flex; flex-direction: column; padding: 12px; gap: 10px; overflow: hidden;
  }
  h1 { font-size: 15px; font-weight: 600; margin: 0; color: var(--muted); letter-spacing: .02em; }

  .carousel { position: relative; flex: 1; min-height: 0; border: 1px solid var(--border);
    border-radius: var(--radius); background: var(--card); overflow: hidden; }
  .track { display: flex; height: 100%; transition: transform .45s ease; }
  .slide { flex: 0 0 100%; height: 100%; display: flex; min-width: 0; }
  .media { flex: 0 0 38%; background: #f2f4f7; }
  .media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .body { flex: 1; min-width: 0; padding: 18px 56px 40px 56px; display: flex; flex-direction: column; gap: 8px; }
  .meta { font-size: 12px; color: var(--muted); }
  .src { font-weight: 600; color: var(--accent); }
  .slide:not(.has-img) .body { border-left: 4px solid var(--accent); }
  .slide h2 { margin: 0; font-size: 18px; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .slide h2 a { color: inherit; text-decoration: none; }
  .slide h2 a:hover { color: var(--accent); }
  .slide p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--muted);
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .more { margin-top: auto; font-size: 13px; font-weight: 600; color: var(--accent); text-decoration: none; }
  .more:hover { text-decoration: underline; }

  .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 32px; height: 32px;
    border-radius: 50%; border: 1px solid var(--border); background: rgba(255,255,255,.92);
    color: var(--text); font-size: 18px; line-height: 1; cursor: pointer; display: grid; place-items: center; }
  .nav:hover { border-color: var(--accent); color: var(--accent); }
  .prev { left: 8px; } .next { right: 8px; }
  .dots { position: absolute; bottom: 12px; left: 0; right: 0; display: flex; justify-content: center; gap: 7px; }
  .dot { width: 8px; height: 8px; padding: 0; border: 0; border-radius: 50%; background: #d0d5dd; cursor: pointer; }
  .dot[aria-current="true"] { background: var(--accent); width: 20px; border-radius: 4px; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  footer { font-size: 11px; color: var(--muted); text-align: right; }
  .empty { padding: 24px; color: var(--muted); }

  /* Narrow iframes: stack image above text */
  @media (max-width: 560px) {
    .slide { flex-direction: column; }
    .media { flex: 0 0 42%; }
    .body { padding: 14px 16px 40px; }
    .slide h2 { font-size: 16px; -webkit-line-clamp: 3; }
    .slide p { -webkit-line-clamp: 2; }
    .slide:not(.has-img) p { -webkit-line-clamp: 6; }
    .nav { top: auto; bottom: 6px; transform: none; width: 28px; height: 28px; }
  }
  @media (prefers-reduced-motion: reduce) { .track { transition: none; } }
</style>
</head>
<body>
  {{HEADING}}
  <section class="carousel" aria-roledescription="carousel" aria-label="Latest items">
    <div class="track">{{SLIDES}}
    </div>
    <button class="nav prev" aria-label="Previous item">‹</button>
    <button class="nav next" aria-label="Next item">›</button>
    <div class="dots">{{DOTS}}</div>
  </section>
  <footer>Updated {{UPDATED}}</footer>

<script>
(() => {
  const AUTOPLAY_MS = {{AUTOPLAY_MS}};
  const root = document.querySelector('.carousel');
  const track = root.querySelector('.track');
  const slides = [...track.querySelectorAll('.slide')];
  const dots = [...root.querySelectorAll('.dot')];
  if (slides.length < 2) { root.querySelectorAll('.nav, .dots').forEach(n => n.remove()); return; }

  let i = 0, timer = null;
  const go = n => {
    i = (n + slides.length) % slides.length;
    track.style.transform = `translateX(-${i * 100}%)`;
    dots.forEach((d, k) => d.setAttribute('aria-current', k === i));
    slides.forEach((s, k) => s.setAttribute('aria-hidden', k !== i));
  };
  const stop = () => { clearInterval(timer); timer = null; };
  const start = () => {
    if (!AUTOPLAY_MS || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    stop(); timer = setInterval(() => go(i + 1), AUTOPLAY_MS);
  };

  root.querySelector('.prev').onclick = () => { go(i - 1); start(); };
  root.querySelector('.next').onclick = () => { go(i + 1); start(); };
  dots.forEach((d, k) => d.onclick = () => { go(k); start(); });

  root.addEventListener('mouseenter', stop);
  root.addEventListener('mouseleave', start);
  root.addEventListener('focusin', stop);
  root.addEventListener('focusout', start);
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') { go(i - 1); start(); }
    if (e.key === 'ArrowRight') { go(i + 1); start(); }
  });

  let x0 = null;
  root.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; stop(); }, { passive: true });
  root.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40) go(i + (dx < 0 ? 1 : -1));
    x0 = null; start();
  });

  go(0); start();
})();
</script>
</body>
</html>
