name: Update feed carousel

on:
  schedule:
    # GitHub often starts scheduled runs late, so there are three daily slots (UTC).
    # Whichever runs first refreshes the tile. The later ones refresh it again.
    - cron: "17 5 * * *"    # 05:17 UTC
    - cron: "47 8 * * *"    # 08:47 UTC (backup)
    - cron: "47 11 * * *"   # 11:47 UTC (backup)
  workflow_dispatch:        # adds a "Run workflow" button for manual updates
  push:
    branches: [main]
    paths: ["build.py", "template.html", "template-phone.html", ".github/workflows/update-carousel.yml"]

permissions:
  contents: write   # to commit the refreshed page. GitHub Pages serves it from the docs folder.

concurrency:
  group: carousel
  cancel-in-progress: true

env:
  # ---- Settings: edit these ----
  FEED_URL: "https://pharma.valona.app/api/feeds/521ef091-7f4b-4395-a14f-75773f203ce3"
  OUTPUT: "docs/index.html"
  ITEM_COUNT: "5"
  AUTOPLAY_SECS: "7"
  # Design: template-phone.html (square phone tile) or template.html (simple card)
  TEMPLATE: "template-phone.html"
  BRAND_HTML: "<b>Pharma</b> Intelligence<span class='pt'>.</span>"
  BRAND_TAGLINE: "Obesity & T2D market insights"
  PANEL_LABEL_HTML: "What's trending<br>in Obesity & T2D"
  CAROUSEL_TITLE: "What's trending in Obesity & T2D"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build carousel from feed
        run: python build.py

      - name: Commit refreshed page
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch docs/.nojekyll
          git add docs
          git diff --cached --quiet || git commit -m "Daily carousel update"
          git push

